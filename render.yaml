services:
  - type: web
    name: smart-tools-hub
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - key: JWT_ACCESS_SECRET
    sync: false
  - key: JWT_REFRESH_SECRET
    sync: false
  - key: JWT_ACCESS_EXPIRES
    value: 15m
  - key: JWT_REFRESH_EXPIRES
    value: 30d
  - key: JWT_ISSUER
    value: SmartToolsHub
  - key: JWT_AUDIENCE
    value: SmartToolsHubUsers
